name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency-free source and safety smoke checks run even if npm is unavailable.
      - name: Repository smoke checks
        run: node --test tests/repository-smoke.smoke.mjs
      # No lockfile exists yet; npm install rather than npm ci is intentional.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (integration DB suite requires isolated credentials)
        run: npm test -- --reporter=verbose
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
